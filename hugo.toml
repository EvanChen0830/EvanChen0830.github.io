baseURL = "https://example.com/"
languageCode = "en-us"
title = "Evan Chen"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

[minify]
  disableXML = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "Notes on quantitative methodology and experiments."
  keywords = ["quant", "research", "methodology", "machine learning"]
  author = "Evan Chen"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = true
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  mainSections = ["quant", "machine-learning"]

  # KaTeX math rendering, toggled per-page via `math: true` in front matter
  math = false

  [params.homeInfoParams]
    Title = "Hi, I'm Evan \U0001F44B"
    Content = "I write about quantitative research methodology and the experiments behind it. This site collects implementation notes, write-ups, and things I've learned building trading and ML systems."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:evan.chen.gpt@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[[menu.main]]
  identifier = "overview"
  name = "Overview"
  url = "/overview/"
  weight = 5

[[menu.main]]
  identifier = "quant"
  name = "Quant"
  url = "/quant/"
  weight = 10

[[menu.main]]
  identifier = "machine-learning"
  name = "Machine Learning"
  url = "/machine-learning/"
  weight = 20

[[menu.main]]
  identifier = "archive"
  name = "Archive"
  url = "/archives/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 40

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 50

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
