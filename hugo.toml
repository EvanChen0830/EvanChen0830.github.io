baseURL = "https://evanchen0830.github.io/"
languageCode = "en-us"
title = "Evan Chen"

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Notes on quantitative methodology and experiments."
  author = "Evan Chen"
  # Which top-level sections feed the home page feed, archive, and search index.
  mainSections = ["quant", "machine-learning"]

  # KaTeX math rendering, toggled per-page via `math: true` in front matter.
  math = false

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

  [markup.goldmark]
    [markup.goldmark.renderer]
      # Keep false: LaTeX math routinely contains bare "<" (e.g. subscripts
      # like U_{<j}). With unsafe=true, goldmark treats "<...>" sequences as
      # raw HTML and the browser's HTML parser swallows them as a bogus tag,
      # corrupting the surrounding DOM. Passthrough math doesn't need unsafe.
      unsafe = false
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
