<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
{{- partial "head.html" . }}
</head>
<body>
<div class="layout">
{{- partial "sidebar.html" . }}
<main>
{{- block "main" . }}{{- end }}
<footer class="site">
  <p>&copy; {{ now.Year }} {{ site.Title }}. Built with Hugo.
  {{- with site.Params.author }} {{ . }}.{{ end }}</p>
</footer>
</main>
</div>
<script>
(function(){
  var btn = document.querySelector(".theme-toggle");
  if(!btn) return;
  var root = document.documentElement;
  var saved = localStorage.getItem("theme");
  if(saved) root.setAttribute("data-theme", saved);
  btn.addEventListener("click", function(){
    var current = root.getAttribute("data-theme");
    var isDark = current ? current === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  });

  // Table of Contents active-link highlighting on scroll
  var tocLinks = Array.from(document.querySelectorAll("#TableOfContents a"));
  if (!tocLinks.length || !("IntersectionObserver" in window)) return;
  var targets = tocLinks.map(function(a){
    var href = a.getAttribute("href");
    return href && href.startsWith("#") ? document.querySelector(href) : null;
  }).filter(Boolean);
  if (!targets.length) return;
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        var idx = targets.indexOf(entry.target);
        tocLinks.forEach(function(l, i){ l.classList.toggle("on", i === idx); });
      }
    });
  }, { rootMargin: "-10% 0px -75% 0px" });
  targets.forEach(function(t){ observer.observe(t); });
})();
</script>
</body>
</html>
