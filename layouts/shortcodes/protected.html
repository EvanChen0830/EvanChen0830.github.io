{{- $salt := .Get "salt" -}}
{{- $iv := .Get "iv" -}}
{{- $iterations := .Get "iterations" -}}
{{- $data := .Get "data" -}}
<div class="protected-block" data-salt="{{ $salt }}" data-iv="{{ $iv }}" data-iterations="{{ $iterations }}" data-payload="{{ $data }}">
  <form class="protected-form">
    <span class="protected-note">This section is password-protected.</span>
    <input type="password" class="protected-input" placeholder="Enter password" autocomplete="off">
    <button type="submit" class="protected-submit">Unlock</button>
    <span class="protected-error">Incorrect password.</span>
  </form>
  <div class="protected-content"></div>
</div>
