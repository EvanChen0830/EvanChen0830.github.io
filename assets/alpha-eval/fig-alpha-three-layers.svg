<svg viewBox="0 0 900 350" style="min-width:760px" role="img" aria-label="The Three-Layer Feature-Alpha Dissection and Residual Alpha" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mf4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<!-- Left: Alpha Signal -->
<rect x="20" y="110" width="145" height="110" rx="8" class="bx label"/>
<text x="92" y="140" class="t hd" text-anchor="middle">Trained Alpha</text>
<text x="92" y="165" class="tm" text-anchor="middle">α ∈ ℝ^L</text>
<text x="92" y="185" class="ts mute" text-anchor="middle">Standardized model</text>
<text x="92" y="202" class="ts mute" text-anchor="middle">forecasts</text>

<!-- Connectors from Alpha to 3 Layers -->
<path d="M165,145 C195,145 195,65 215,65" class="ar" marker-end="url(#mf4)"/>
<path d="M165,165 L215,165" class="ar" marker-end="url(#mf4)"/>
<path d="M165,185 C195,185 195,265 215,265" class="ar" marker-end="url(#mf4)"/>

<!-- Layer 1: Raw Output Exposure -->
<rect x="220" y="25" width="370" height="80" rx="8" class="bx feat"/>
<text x="235" y="50" class="t hd" text-anchor="start">Layer 1: Raw Output Exposure</text>
<text x="235" y="70" class="tm" text-anchor="start">Corr(α, X_p)  or  α ≈ Σ β_p X_p</text>
<text x="235" y="90" class="ts mute" text-anchor="start">Linear exposure to raw feature panel</text>

<!-- Layer 2: Mechanism Inheritance -->
<rect x="220" y="125" width="370" height="80" rx="8" class="bx ticker"/>
<text x="235" y="150" class="t hd" text-anchor="start">Layer 2: Mechanism Inheritance</text>
<text x="235" y="170" class="tm" text-anchor="start">c_α = αᵀ W Φ,   c_α^proj = Proj_ℱ(c_α)</text>
<text x="235" y="190" class="ts mute" text-anchor="start">Measures projection onto feature mechanism span</text>

<!-- Layer 3: Residual Alpha & Surrogate -->
<rect x="220" y="225" width="370" height="80" rx="8" class="bx guide"/>
<text x="235" y="250" class="t hd" text-anchor="start">Layer 3: OOS Surrogate &amp; Residual</text>
<text x="235" y="270" class="tm" text-anchor="start">α̂ = Σ β̂_p^OOS X_p  →  ε_α = α − α̂</text>
<text x="235" y="290" class="ts mute" text-anchor="start">Removes best OOS linear feature reconstruction</text>

<!-- Connector to Decision Box -->
<line x1="590" y1="265" x2="625" y2="265" class="ar" marker-end="url(#mf4)"/>

<!-- Right: Truly Novel Signal Evaluation -->
<rect x="630" y="55" width="250" height="230" rx="8" class="bx plain"/>
<text x="755" y="82" class="t hd" text-anchor="middle">Novelty Diagnostic</text>

<rect x="645" y="100" width="220" height="75" rx="5" class="bx guide"/>
<text x="755" y="123" class="ts" text-anchor="middle">Residual Significance</text>
<text x="755" y="143" class="tm guide-t" text-anchor="middle">Q_ε = ||c_ε||²,   p_nov &lt; 0.05</text>
<text x="755" y="162" class="ts mute" text-anchor="middle">Permutation test vs null</text>

<rect x="645" y="190" width="220" height="75" rx="5" class="bx plain"/>
<text x="755" y="213" class="ts" text-anchor="middle">Novelty Fraction</text>
<text x="755" y="233" class="tm" text-anchor="middle">ν_α = Q_nov / Q_α</text>
<text x="755" y="252" class="ts mute" text-anchor="middle">High ν_α = genuine novel signal</text>

<!-- Bottom Annotation -->
<text x="450" y="330" class="ts mute" text-anchor="middle">Disentangles genuine machine-learned non-linear alpha from repackaged linear factor exposure.</text>
</svg>
