<svg viewBox="0 0 900 350" style="min-width:760px" role="img" aria-label="Sub-Universe Restriction Gram and Directional-Volatility Coupling" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mf5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<!-- Left: Parent Basis & Sub-Universe Filter -->
<rect x="20" y="40" width="165" height="105" rx="8" class="bx plain"/>
<text x="102" y="70" class="t hd" text-anchor="middle">Parent Basis  Φ</text>
<text x="102" y="95" class="tm" text-anchor="middle">Φ = [Φ_D | Φ_V | Φ_T]</text>
<text x="102" y="120" class="ts mute" text-anchor="middle">Global reference basis</text>

<rect x="20" y="165" width="165" height="105" rx="8" class="bx ticker"/>
<text x="102" y="195" class="t hd" text-anchor="middle">Sub-Universe  𝒰</text>
<text x="102" y="220" class="tm" text-anchor="middle">W_𝒰 = diag(w_i · 𝟙_𝒰)</text>
<text x="102" y="245" class="ts mute" text-anchor="middle">Asset membership mask</text>

<line x1="185" y1="92" x2="225" y2="135" class="ar" marker-end="url(#mf5)"/>
<line x1="185" y1="217" x2="225" y2="175" class="ar" marker-end="url(#mf5)"/>

<!-- Center: Restriction Gram Matrix Block Structure -->
<rect x="230" y="30" width="340" height="250" rx="8" class="bx plain"/>
<text x="400" y="55" class="t hd" text-anchor="middle">Restriction Gram  G_𝒰 = Φᵀ W_𝒰 Φ</text>

<!-- Block Matrix Grid -->
<rect x="250" y="72" width="92" height="72" rx="4" class="bx feat"/>
<text x="296" y="105" class="tm" text-anchor="middle">G_DD</text>
<text x="296" y="125" class="ts feat-s" text-anchor="middle">Direction</text>

<rect x="354" y="72" width="92" height="72" rx="4" class="bx guide"/>
<text x="400" y="105" class="tm guide-t" text-anchor="middle">G_DV</text>
<text x="400" y="125" class="ts guide-t" text-anchor="middle">Coupling</text>

<rect x="458" y="72" width="92" height="72" rx="4" class="bx plain"/>
<text x="504" y="105" class="tm" text-anchor="middle">G_DT</text>
<text x="504" y="125" class="ts mute" text-anchor="middle">Tail Cross</text>

<rect x="250" y="152" width="92" height="72" rx="4" class="bx guide"/>
<text x="296" y="185" class="tm guide-t" text-anchor="middle">G_VD</text>
<text x="296" y="205" class="ts guide-t" text-anchor="middle">Coupling</text>

<rect x="354" y="152" width="92" height="72" rx="4" class="bx ticker"/>
<text x="400" y="185" class="tm" text-anchor="middle">G_VV</text>
<text x="400" y="205" class="ts" text-anchor="middle">Volatility</text>

<rect x="458" y="152" width="92" height="72" rx="4" class="bx plain"/>
<text x="504" y="185" class="tm" text-anchor="middle">G_VT</text>
<text x="504" y="205" class="ts mute" text-anchor="middle">Activity</text>

<text x="400" y="255" class="ts mute" text-anchor="middle">Diagonal: Enrichment  |  Off-Diagonal: Coupling</text>

<line x1="570" y1="155" x2="605" y2="155" class="ar" marker-end="url(#mf5)"/>

<!-- Right: Canonical Coupling Analysis & Null Testing -->
<rect x="610" y="35" width="270" height="245" rx="8" class="bx guide"/>
<text x="745" y="62" class="t hd" text-anchor="middle">Canonical V ↔ D Coupling</text>

<rect x="625" y="80" width="240" height="52" rx="4" class="bx plain"/>
<text x="745" y="100" class="ts" text-anchor="middle">Normalized Coupling Operator</text>
<text x="745" y="120" class="tm" text-anchor="middle">M_VD = G_VV^(-½) G_VD G_DD^(-½)</text>

<rect x="625" y="142" width="240" height="54" rx="4" class="bx plain"/>
<text x="745" y="163" class="ts" text-anchor="middle">Singular Value Decomposition</text>
<text x="745" y="183" class="tm guide-t" text-anchor="middle">M_VD = U_c Σ_c V_cᵀ  (modes σ_k)</text>

<rect x="625" y="206" width="240" height="52" rx="4" class="bx plain"/>
<text x="745" y="226" class="ts" text-anchor="middle">Stratified Membership Null</text>
<text x="745" y="244" class="ts mute" text-anchor="middle">Tests if coupling &gt; random null</text>

<!-- Bottom Annotation (2 lines) -->
<text x="450" y="310" class="ts mute" text-anchor="middle">Tests whether a sub-universe contains authentic economic structure</text>
<text x="450" y="330" class="ts mute" text-anchor="middle">or merely random portfolio variance.</text>
</svg>
