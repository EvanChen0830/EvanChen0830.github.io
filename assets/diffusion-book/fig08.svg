<svg viewBox="0 0 880 320" style="min-width:760px" role="img" aria-label="Three guidance variants" xmlns="http://www.w3.org/2000/svg"><defs><marker id="m8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="10" width="270" height="270" rx="10" class="stack"/><text x="145" y="36" class="t hd" text-anchor="middle">Classifier-free guidance</text><rect x="25" y="52" width="115" height="66" rx="6" class="bx feat"/><text x="82.5" y="73.5" class="t" text-anchor="middle">main</text><text x="82.5" y="89.5" class="t" text-anchor="middle">full X</text><text x="82.5" y="105.5" class="t" text-anchor="middle">G = 1</text><rect x="150" y="52" width="115" height="66" rx="6" class="bx guide"/><text x="207.5" y="73.5" class="t" text-anchor="middle">reference</text><text x="207.5" y="89.5" class="t" text-anchor="middle">same model</text><text x="207.5" y="105.5" class="t" text-anchor="middle">G = 0</text><line x1="82" y1="118" x2="135" y2="160" class="ar" marker-end="url(#m8)"/><line x1="208" y1="118" x2="155" y2="160" class="ar" marker-end="url(#m8)"/><rect x="30" y="160" width="230" height="44" rx="6" class="bx guide"/><text x="145.0" y="186.5" class="t" text-anchor="middle">ε_u + η (ε_c − ε_u)</text><text x="145" y="230" class="ts mute" text-anchor="middle">η = 1 → plain conditional</text><rect x="300" y="10" width="270" height="270" rx="10" class="stack"/><text x="435" y="36" class="t hd" text-anchor="middle">AutoGuidance</text><rect x="315" y="52" width="115" height="66" rx="6" class="bx feat"/><text x="372.5" y="73.5" class="t" text-anchor="middle">main</text><text x="372.5" y="89.5" class="t" text-anchor="middle">good model</text><text x="372.5" y="105.5" class="t" text-anchor="middle">full X</text><rect x="440" y="52" width="115" height="66" rx="6" class="bx plain"/><text x="497.5" y="73.5" class="t" text-anchor="middle">reference</text><text x="497.5" y="89.5" class="t" text-anchor="middle">weak model</text><text x="497.5" y="105.5" class="t" text-anchor="middle">full X</text><line x1="372" y1="118" x2="425" y2="160" class="ar" marker-end="url(#m8)"/><line x1="498" y1="118" x2="445" y2="160" class="ar" marker-end="url(#m8)"/><rect x="320" y="160" width="230" height="44" rx="6" class="bx guide"/><text x="435.0" y="186.5" class="t" text-anchor="middle">ε_good + η (ε_good − ε_bad)</text><text x="435" y="230" class="ts mute" text-anchor="middle">η = 0 → plain good model</text><rect x="590" y="10" width="270" height="270" rx="10" class="stack"/><text x="725" y="36" class="t hd" text-anchor="middle">Volatility-only guider</text><rect x="605" y="52" width="115" height="66" rx="6" class="bx feat"/><text x="662.5" y="73.5" class="t" text-anchor="middle">main</text><text x="662.5" y="89.5" class="t" text-anchor="middle">full X</text><text x="662.5" y="105.5" class="t" text-anchor="middle">(vol + dir)</text><rect x="730" y="52" width="115" height="66" rx="6" class="bx plain"/><text x="787.5" y="73.5" class="t" text-anchor="middle">reference</text><text x="787.5" y="89.5" class="t" text-anchor="middle">model with</text><text x="787.5" y="105.5" class="t" text-anchor="middle">X_vol only</text><line x1="662" y1="118" x2="715" y2="160" class="ar" marker-end="url(#m8)"/><line x1="788" y1="118" x2="735" y2="160" class="ar" marker-end="url(#m8)"/><rect x="610" y="160" width="230" height="44" rx="6" class="bx guide"/><text x="725.0" y="186.5" class="t" text-anchor="middle">ε_full + η (ε_full − ε_vol)</text><text x="725" y="230" class="ts mute" text-anchor="middle">amplifies what X_dir adds</text><text x="445" y="305" class="ts" text-anchor="middle">The reference decides what gets amplified: the difference between branches is the signal.</text></svg>
