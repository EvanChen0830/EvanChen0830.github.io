" y="202" width="34" height="20" rx="2" class="cell label"/><rect x="502" y="202" width="34" height="20" rx="2" class="cell label"/><rect x="538" y="202" width="34" height="20" rx="2" class="cell label"/><text x="502.0" y="173.0" class="t mute" text-anchor="middle">⋮</text><text x="447.0" y="64" class="ts mute" text-anchor="middle">1d</text><text x="483.0" y="64" class="ts mute" text-anchor="middle">3d</text><text x="519.0" y="64" class="ts mute" text-anchor="middle">5d</text><text x="555.0" y="64" class="ts mute" text-anchor="middle">10d</text><text x="502" y="242" class="ts mute" text-anchor="middle">H horizons per ticker</text><rect x="424" y="88" width="152" height="28" rx="5" class="hl"/><path d="M582,100 C 640,100 640,110 660,110" class="ar thin" fill="none" marker-end="url(#m1)"/><text x="665" y="100" class="ts" text-anchor="start">one row = one</text><text x="665" y="116" class="ts" text-anchor="start">Transformer token</text><text x="665" y="132" class="ts mute" text-anchor="start">(its H numbers are</text><text x="665" y="148" class="ts mute" text-anchor="start">coordinates, not tokens)</text><rect x="400" y="300" width="400" height="92" rx="8" class="bx plain"/><text x="420" y="326" class="t hd" text-anchor="start">Example sizes</text><text x="420" y="348" class="tm" text-anchor="start">B = 64 dates, N = 200 tickers, F = 32, H = 4</text><text x="420" y="368" class="tm" text-anchor="start">X: [64, 200, 32]      Y: [64, 200, 4]</text><text x="420" y="385" class="ts mute" text-anchor="start">sequence length = N = 200 tokens</text></svg>
