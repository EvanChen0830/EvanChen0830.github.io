<svg viewBox="0 0 870 410" style="min-width:640px" role="img" aria-label="How encoder and decoder tokens are built" xmlns="http://www.w3.org/2000/svg"><defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="20" y="30" class="t hd" text-anchor="start">Encoder token for ticker i</text><rect x="20" y="45" width="150" height="50" rx="6" class="bx feat"/><text x="95.0" y="66.5" class="t" text-anchor="middle">features x_i</text><text x="95.0" y="82.5" class="tm" text-anchor="middle">[F]</text><rect x="20" y="105" width="150" height="50" rx="6" class="bx ticker"/><text x="95.0" y="126.5" class="t" text-anchor="middle">ticker id i</text><text x="95.0" y="142.5" class="tm" text-anchor="middle">int</text><rect x="220" y="45" width="130" height="50" rx="6" class="bx plain"/><text x="285.0" y="74.5" class="t" text-anchor="middle">Linear F→d</text><rect x="220" y="105" width="130" height="50" rx="6" class="bx plain"/><text x="285.0" y="134.5" class="t" text-anchor="middle">Embedding</text><line x1="170" y1="70" x2="218" y2="70" class="ar" marker-end="url(#m2)"/><line x1="170" y1="130" x2="218" y2="130" class="ar" marker-end="url(#m2)"/><circle cx="400" cy="100" r="15" class="bx plain"/><text x="400" y="105" class="t" text-anchor="middle">+</text><line x1="350" y1="70" x2="386" y2="92" class="ar" marker-end="url(#m2)"/><line x1="350" y1="130" x2="386" y2="108" class="ar" marker-end="url(#m2)"/><line x1="415" y1="100" x2="470" y2="100" class="ar" marker-end="url(#m2)"/><rect x="470" y="75" width="160" height="50" rx="6" class="bx feat"/><text x="550.0" y="96.5" class="t" text-anchor="middle">encoder token</text><text x="550.0" y="112.5" class="tm" text-anchor="middle">[d]</text><text x="20" y="200" class="t hd" text-anchor="start">Decoder token for ticker i at noise level τ</text><rect x="20" y="215" width="150" height="50" rx="6" class="bx label"/><text x="95.0" y="236.5" class="t" text-anchor="middle">noisy labels z_i,τ</text><text x="95.0" y="252.5" class="tm" text-anchor="middle">[H]</text><rect x="20" y="275" width="150" height="50" rx="6" class="bx ticker"/><text x="95.0" y="296.5" class="t" text-anchor="middle">ticker id i</text><text x="95.0" y="312.5" class="tm" text-anchor="middle">int</text><rect x="20" y="335" width="150" height="50" rx="6" class="bx time"/><text x="95.0" y="356.5" class="t" text-anchor="middle">diffusion step τ</text><text x="95.0" y="372.5" class="tm" text-anchor="middle">int</text><rect x="220" y="215" width="130" height="50" rx="6" class="bx plain"/><text x="285.0" y="244.5" class="t" text-anchor="middle">Linear H→d</text><rect x="220" y="275" width="130" height="50" rx="6" class="bx plain"/><text x="285.0" y="296.5" class="t" text-anchor="middle">Embedding</text><text x="285.0" y="312.5" class="t" text-anchor="middle">(shared)</text><rect x="220" y="335" width="130" height="50" rx="6" class="bx plain"/><text x="285.0" y="364.5" class="t" text-anchor="middle">sinusoid + MLP</text><line x1="170" y1="240" x2="218" y2="240" class="ar" marker-end="url(#m2)"/><line x1="170" y1="300" x2="218" y2="300" class="ar" marker-end="url(#m2)"/><line x1="170" y1="360" x2="218" y2="360" class="ar" marker-end="url(#m2)"/><circle cx="400" cy="300" r="15" class="bx plain"/><text x="400" y="305" class="t" text-anchor="middle">+</text><line x1="350" y1="240" x2="388" y2="290" class="ar" marker-end="url(#m2)"/><line x1="350" y1="300" x2="384" y2="300" class="ar" marker-end="url(#m2)"/><line x1="350" y1="360" x2="388" y2="310" class="ar" marker-end="url(#m2)"/><line x1="415" y1="300" x2="470" y2="300" class="ar" marker-end="url(#m2)"/><rect x="470" y="275" width="160" height="50" rx="6" class="bx label"/><text x="550.0" y="296.5" class="t" text-anchor="middle">decoder token</text><text x="550.0" y="312.5" class="tm" text-anchor="middle">[d]</text><rect x="660" y="210" width="190" height="180" rx="8" class="note"/><text x="675" y="236" class="ts" text-anchor="start">τ is noise level,</text><text x="675" y="254" class="ts" text-anchor="start">not forecast horizon.</text><text x="675" y="272" class="ts" text-anchor="start"></text><text x="675" y="290" class="ts" text-anchor="start">Market features never</text><text x="675" y="308" class="ts" text-anchor="start">enter the decoder token:</text><text x="675" y="326" class="ts" text-anchor="start">they arrive only through</text><text x="675" y="344" class="ts" text-anchor="start">cross-attention, so they</text><text x="675" y="362" class="ts" text-anchor="start">can be switched off.</text></svg>
