<svg viewBox="0 0 700 315" style="min-width:600px" role="img" aria-label="From generated samples to portfolios and groups" xmlns="http://www.w3.org/2000/svg"><defs><marker id="m11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="10" y="120" width="170" height="60" rx="6" class="bx label"/><text x="95.0" y="138.5" class="t" text-anchor="middle">samples for one date,</text><text x="95.0" y="154.5" class="t" text-anchor="middle">one horizon</text><text x="95.0" y="170.5" class="tm" text-anchor="middle">[K, N]</text><line x1="180" y1="140" x2="240" y2="60" class="ar" marker-end="url(#m11)"/><line x1="180" y1="150" x2="240" y2="150" class="ar" marker-end="url(#m11)"/><line x1="180" y1="160" x2="240" y2="245" class="ar" marker-end="url(#m11)"/><rect x="240" y="35" width="180" height="50" rx="6" class="bx plain"/><text x="330.0" y="56.5" class="t" text-anchor="middle">mean μ  [N]</text><text x="330.0" y="72.5" class="t" text-anchor="middle">covariance Σ  [N, N]</text><line x1="420" y1="60" x2="470" y2="60" class="ar" marker-end="url(#m11)"/><rect x="470" y="35" width="220" height="50" rx="6" class="bx feat"/><text x="580.0" y="56.5" class="t" text-anchor="middle">mean–variance weights</text><text x="580.0" y="72.5" class="tm" text-anchor="middle">max μᵀw − γ/2 wᵀΣw</text><rect x="240" y="125" width="180" height="50" rx="6" class="bx plain"/><text x="330.0" y="146.5" class="t" text-anchor="middle">portfolio return per</text><text x="330.0" y="162.5" class="t" text-anchor="middle">sample: Ŷ w  [K]</text><line x1="420" y1="150" x2="470" y2="150" class="ar" marker-end="url(#m11)"/><rect x="470" y="125" width="220" height="50" rx="6" class="bx feat"/><text x="580.0" y="146.5" class="t" text-anchor="middle">exponential utility</text><text x="580.0" y="162.5" class="tm" text-anchor="middle">min mean exp(−γ Ŷ w)</text><rect x="240" y="220" width="180" height="50" rx="6" class="bx plain"/><text x="330.0" y="241.5" class="t" text-anchor="middle">ticker × ticker</text><text x="330.0" y="257.5" class="t" text-anchor="middle">distances  [N, N]</text><line x1="420" y1="245" x2="470" y2="245" class="ar" marker-end="url(#m11)"/><rect x="470" y="220" width="220" height="50" rx="6" class="bx ticker"/><text x="580.0" y="249.5" class="t" text-anchor="middle">conditional ticker groups</text><text x="350" y="300" class="ts mute" text-anchor="middle">Keep samples paired across tickers: covariance and co-movement live in the joint draws.</text></svg>
