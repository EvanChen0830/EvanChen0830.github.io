<svg viewBox="0 0 880 320" style="min-width:760px" role="img" aria-label="Direction-First Feature Selection Pipeline" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<!-- Stage 1: Candidate Pool -->
<rect x="15" y="60" width="160" height="200" rx="8" class="bx feat"/>
<text x="95" y="90" class="t hd" text-anchor="middle">Candidate Pool  ℱ</text>
<text x="95" y="115" class="tm" text-anchor="middle">P ≈ 500 features</text>
<text x="95" y="145" class="ts mute" text-anchor="middle">• Momentum &amp; Reversal</text>
<text x="95" y="170" class="ts mute" text-anchor="middle">• Microstructure / Flow</text>
<text x="95" y="195" class="ts mute" text-anchor="middle">• Fundamental / Vol</text>
<text x="95" y="235" class="ts" text-anchor="middle">Raw feature space</text>

<line x1="175" y1="160" x2="215" y2="160" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 2: Eligibility Filtering -->
<rect x="220" y="60" width="180" height="200" rx="8" class="bx plain"/>
<text x="310" y="90" class="t hd" text-anchor="middle">1. Eligibility Filter</text>
<text x="310" y="115" class="ts mute" text-anchor="middle">Three mandatory gates:</text>
<rect x="235" y="125" width="150" height="32" rx="4" class="bx plain"/>
<text x="310" y="145" class="tm" text-anchor="middle">p_WY ≤ 0.05</text>
<rect x="235" y="165" width="150" height="32" rx="4" class="bx plain"/>
<text x="310" y="185" class="tm" text-anchor="middle">A^tgt ≥ 0.50</text>
<rect x="235" y="205" width="150" height="32" rx="4" class="bx plain"/>
<text x="310" y="225" class="tm" text-anchor="middle">π^time ≥ 0.80</text>

<line x1="400" y1="160" x2="440" y2="160" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 3: Mechanism Grouping -->
<rect x="445" y="60" width="195" height="200" rx="8" class="bx ticker"/>
<text x="542" y="90" class="t hd" text-anchor="middle">2. Mechanism Groups</text>
<text x="542" y="115" class="ts" text-anchor="middle">Average-Linkage Tree</text>
<text x="542" y="135" class="tm" text-anchor="middle">Cut at S^D ≥ 0.90</text>

<!-- Mini Cluster Branches -->
<rect x="460" y="150" width="165" height="30" rx="4" class="bx plain"/>
<text x="542" y="170" class="ts" text-anchor="middle">Group G₁ (Price trend cluster)</text>
<rect x="460" y="188" width="165" height="30" rx="4" class="bx plain"/>
<text x="542" y="208" class="ts" text-anchor="middle">Group G₂ (Order flow cluster)</text>
<text x="542" y="242" class="ts mute" text-anchor="middle">Yields M mechanism families</text>

<line x1="640" y1="160" x2="680" y2="160" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 4: Direction-First Coverage Selection -->
<rect x="685" y="60" width="180" height="200" rx="8" class="bx guide"/>
<text x="775" y="90" class="t hd" text-anchor="middle">3. Direction-First Fill</text>
<text x="775" y="115" class="ts mute" text-anchor="middle">Greedy coverage fill:</text>

<rect x="700" y="130" width="150" height="42" rx="4" class="bx plain"/>
<text x="775" y="148" class="ts" text-anchor="middle">Stage 1: Direction</text>
<text x="775" y="164" class="tm guide-t" text-anchor="middle">Cov_D ≥ 0.90</text>

<rect x="700" y="180" width="150" height="42" rx="4" class="bx plain"/>
<text x="775" y="198" class="ts" text-anchor="middle">Stage 2: Vol &amp; Tail</text>
<text x="775" y="214" class="tm" text-anchor="middle">Cov_(V,T) ≥ 0.80</text>

<text x="775" y="248" class="ts" text-anchor="middle">Selected subset ℱ*</text>

<!-- Bottom Annotation -->
<text x="440" y="295" class="ts mute" text-anchor="middle">Direction-first selection prevents high-energy volatility/activity features from crowding out subtle directional trading signals.</text>
</svg>
