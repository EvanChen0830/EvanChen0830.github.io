<svg viewBox="0 0 890 350" style="min-width:760px" role="img" aria-label="Direction-First Feature Selection Pipeline" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mf3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<!-- Stage 1: Candidate Pool -->
<rect x="15" y="45" width="165" height="225" rx="8" class="bx feat"/>
<text x="97" y="75" class="t hd" text-anchor="middle">Candidate Pool  ℱ</text>
<text x="97" y="100" class="tm" text-anchor="middle">P ≈ 500 features</text>
<text x="97" y="130" class="ts mute" text-anchor="middle">• Momentum &amp; Trend</text>
<text x="97" y="155" class="ts mute" text-anchor="middle">• Flow &amp; Imbalance</text>
<text x="97" y="180" class="ts mute" text-anchor="middle">• Volatility &amp; Tail</text>
<text x="97" y="210" class="ts mute" text-anchor="middle">• Reversals &amp; Liquidity</text>
<text x="97" y="248" class="ts" text-anchor="middle">Raw feature space</text>

<line x1="180" y1="157" x2="215" y2="157" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 2: Eligibility Filtering -->
<rect x="220" y="45" width="185" height="225" rx="8" class="bx plain"/>
<text x="312" y="75" class="t hd" text-anchor="middle">1. Eligibility Filter</text>
<text x="312" y="100" class="ts mute" text-anchor="middle">Three mandatory gates:</text>
<rect x="235" y="115" width="155" height="36" rx="4" class="bx plain"/>
<text x="312" y="138" class="tm" text-anchor="middle">p_WY ≤ 0.05</text>
<rect x="235" y="160" width="155" height="36" rx="4" class="bx plain"/>
<text x="312" y="183" class="tm" text-anchor="middle">A^tgt ≥ 0.50</text>
<rect x="235" y="205" width="155" height="36" rx="4" class="bx plain"/>
<text x="312" y="228" class="tm" text-anchor="middle">π^time ≥ 0.80</text>

<line x1="405" y1="157" x2="440" y2="157" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 3: Mechanism Grouping -->
<rect x="445" y="45" width="205" height="225" rx="8" class="bx ticker"/>
<text x="547" y="75" class="t hd" text-anchor="middle">2. Mechanism Groups</text>
<text x="547" y="100" class="ts" text-anchor="middle">Average-Linkage Tree</text>
<text x="547" y="120" class="tm" text-anchor="middle">Cut at S^D ≥ 0.90</text>

<!-- Cluster Branches -->
<rect x="458" y="135" width="180" height="36" rx="4" class="bx plain"/>
<text x="547" y="158" class="ts" text-anchor="middle">Group G₁: Price Trend</text>
<rect x="458" y="180" width="180" height="36" rx="4" class="bx plain"/>
<text x="547" y="203" class="ts" text-anchor="middle">Group G₂: Order Flow</text>
<text x="547" y="245" class="ts mute" text-anchor="middle">Yields M mechanism families</text>

<line x1="650" y1="157" x2="685" y2="157" class="ar" marker-end="url(#mf3)"/>

<!-- Stage 4: Direction-First Coverage Selection -->
<rect x="690" y="45" width="185" height="225" rx="8" class="bx guide"/>
<text x="782" y="75" class="t hd" text-anchor="middle">3. Direction-First Fill</text>
<text x="782" y="100" class="ts mute" text-anchor="middle">Greedy coverage fill:</text>

<rect x="702" y="120" width="161" height="46" rx="4" class="bx plain"/>
<text x="782" y="140" class="ts" text-anchor="middle">Stage 1: Direction</text>
<text x="782" y="157" class="tm guide-t" text-anchor="middle">Cov_D ≥ 0.90</text>

<rect x="702" y="175" width="161" height="46" rx="4" class="bx plain"/>
<text x="782" y="195" class="ts" text-anchor="middle">Stage 2: Vol &amp; Tail</text>
<text x="782" y="212" class="tm" text-anchor="middle">Cov_(V,T) ≥ 0.80</text>

<text x="782" y="250" class="ts" text-anchor="middle">Selected subset ℱ*</text>

<!-- Bottom Annotation (2 lines) -->
<text x="445" y="305" class="ts mute" text-anchor="middle">Direction-first selection prevents high-energy volatility and activity features</text>
<text x="445" y="325" class="ts mute" text-anchor="middle">from crowding out subtle directional trading signals.</text>
</svg>
