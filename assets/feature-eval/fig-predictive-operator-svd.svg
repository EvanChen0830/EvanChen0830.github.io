<svg viewBox="0 0 890 350" style="min-width:760px" role="img" aria-label="Predictive Operator, SVD Truncation and Significant Subspace" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="mf2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<!-- Left: Input Matrices -->
<rect x="20" y="30" width="125" height="110" rx="6" class="bx feat"/>
<text x="82" y="60" class="t hd" text-anchor="middle">Features  X</text>
<text x="82" y="85" class="tm" text-anchor="middle">[L, P]</text>
<text x="82" y="110" class="ts mute" text-anchor="middle">demeaned, unit-norm</text>

<rect x="20" y="160" width="125" height="110" rx="6" class="bx label"/>
<text x="82" y="190" class="t hd" text-anchor="middle">Basis  Φ</text>
<text x="82" y="215" class="tm" text-anchor="middle">[L, d_Φ]</text>
<text x="82" y="240" class="ts mute" text-anchor="middle">Φᵀ W Φ = I</text>

<!-- Contraction operator -->
<line x1="145" y1="85" x2="190" y2="135" class="ar" marker-end="url(#mf2)"/>
<line x1="145" y1="215" x2="190" y2="165" class="ar" marker-end="url(#mf2)"/>

<!-- Center-Left: Predictive Operator C -->
<rect x="195" y="100" width="145" height="100" rx="8" class="bx plain"/>
<text x="267" y="130" class="t hd" text-anchor="middle">Predictive Matrix</text>
<text x="267" y="155" class="tm" text-anchor="middle">C = Xᵀ W Φ</text>
<text x="267" y="178" class="ts mute" text-anchor="middle">shape: [P, d_Φ]</text>

<line x1="340" y1="150" x2="380" y2="150" class="ar" marker-end="url(#mf2)"/>

<!-- Center: SVD & Null Spectrum Plot -->
<rect x="385" y="25" width="265" height="250" rx="8" class="bx plain"/>
<text x="517" y="50" class="t hd" text-anchor="middle">SVD &amp; Permutation Null</text>
<text x="517" y="72" class="tm" text-anchor="middle">C = U S Vᵀ</text>

<!-- Mini Eigenspectrum Chart -->
<line x1="410" y1="215" x2="625" y2="215" class="gridl"/>
<line x1="410" y1="85" x2="410" y2="215" class="gridl"/>

<!-- Real singular values (steep drop) -->
<polyline points="420,100 440,115 460,140 480,175 500,200 520,208 550,211 600,213" class="ln feat-s" fill="none"/>
<!-- Null singular values (flat noise floor) -->
<polyline points="420,160 440,168 460,175 480,183 500,190 520,197 550,203 600,208" class="ln dash mute" fill="none"/>

<!-- Truncation cut line -->
<line x1="470" y1="90" x2="470" y2="215" class="real"/>
<text x="470" y="85" class="ts guide-t" text-anchor="middle">r_sig cutoff</text>

<text x="560" y="125" class="ts feat-s" text-anchor="start">signal modes</text>
<text x="560" y="175" class="ts mute" text-anchor="start">null floor</text>
<text x="517" y="240" class="ts mute" text-anchor="middle">Retain V_r ∈ ℝ^(d_Φ × r_sig)</text>

<line x1="650" y1="150" x2="675" y2="150" class="ar" marker-end="url(#mf2)"/>

<!-- Right: Evaluated Signals & Decisions -->
<rect x="680" y="30" width="195" height="240" rx="8" class="bx guide"/>
<text x="777" y="58" class="t hd" text-anchor="middle">Feature Output</text>

<rect x="692" y="75" width="171" height="52" rx="5" class="bx plain"/>
<text x="777" y="96" class="ts" text-anchor="middle">Quality (Signal Energy)</text>
<text x="777" y="114" class="tm" text-anchor="middle">Q_p = ||c_p||²</text>

<rect x="692" y="135" width="171" height="52" rx="5" class="bx plain"/>
<text x="777" y="156" class="ts" text-anchor="middle">Fingerprint Vector</text>
<text x="777" y="174" class="tm" text-anchor="middle">f_p = (f_D, f_V, f_T)</text>

<rect x="692" y="195" width="171" height="52" rx="5" class="bx plain"/>
<text x="777" y="216" class="ts" text-anchor="middle">Target Alignment</text>
<text x="777" y="234" class="tm" text-anchor="middle">A_p^tgt = cos(c_p^D, r_D)</text>

<!-- Bottom caption note -->
<text x="445" y="305" class="ts mute" text-anchor="middle">Circular date-permutation breaks time synchrony while preserving cross-sectional correlation,</text>
<text x="445" y="325" class="ts mute" text-anchor="middle">isolating genuine predictive modes from noise floor.</text>
</svg>
